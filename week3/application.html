<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue elements </title>
</head>
<body>
    <div id = "app">
        <h1>{{message}}</h1>
        <input type="text" v-model="visitorName"placeholder="Enter your name: ">
        <button v-on:click="sayHi">"Say Hi!</button>
        <p v-if="count==0">No replies yet</p>
        <p v-else-if = "count>3">You are popular nigga</p>
        <p v-else>Total replies: {{ count }}</p>
        <ul>
            <li v-for="name in visitors">{{ name }} said hi</li>
        </ul>
        <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
        <script src="application.js"></script>
    </div>
</body>
</html>
