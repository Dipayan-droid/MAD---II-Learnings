<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Horizontal Countdown</title>
<style>
  /* Modern, rounded typeface for a premium look */
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

  :root {
    --bg-main: transparent;
    --card-bg: rgba(255, 255, 255, 0.85);
    --card-border: rgba(255, 255, 255, 0.5);
    --text-main: #1e293b;
    --text-muted: #64748b;
    
    /* Vibrant gradient for the active/closest event */
    --gradient-active: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
    --gradient-active-bg: background: linear-gradient(135deg, rgba(99,102,241,0.1) 0%, rgba(236,72,153,0.1) 100%);
  }

  body {
    font-family: 'Outfit', -apple-system, sans-serif;
    margin: 0;
    padding: 20px;
    background: var(--bg-main);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }

  /* Horizontal scrolling container */
  .timeline-wrapper {
    width: 100%;
    max-width: 900px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 20px; /* Space for scrollbar */
    
    /* Custom Scrollbar for aesthetic */
    scrollbar-width: thin;
    scrollbar-color: #cbd5e1 transparent;
  }

  .timeline-wrapper::-webkit-scrollbar {
    height: 8px;
  }
  .timeline-wrapper::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.03);
    border-radius: 10px;
  }
  .timeline-wrapper::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
  }
  .timeline-wrapper::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  /* Flexbox for horizontal layout */
  .timeline-container {
    display: flex;
    flex-direction: row;
    gap: 20px;
    width: max-content;
    padding: 10px;
  }

  /* Individual Event Boxes */
  .event-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px;
    min-width: 280px;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
  }

  .event-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.12);
  }

  /* Styling for the closest event (Hero Card) */
  .event-card.active {
    border: 2px solid transparent;
    background-image: linear-gradient(white, white), var(--gradient-active);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: 0 15px 35px -5px rgba(99, 102, 241, 0.3);
    animation: pulseShadow 3s infinite alternate;
  }

  @keyframes pulseShadow {
    0% { box-shadow: 0 15px 35px -5px rgba(99, 102, 241, 0.2); }
    100% { box-shadow: 0 15px 45px 5px rgba(236, 72, 153, 0.4); }
  }

  /* Header inside the card containing Icon and Title */
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .icon-box {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #475569;
  }
  
  .active .icon-box {
    background: var(--gradient-active);
    color: white;
  }

  .card-title-group {
    display: flex;
    flex-direction: column;
  }

  .card-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0;
  }

  .card-date {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
  }

  /* The actual timer grid inside the card */
  .timer-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    text-align: center;
  }

  .timer-unit {
    background: #f8fafc;
    border-radius: 10px;
    padding: 10px 4px;
    border: 1px solid #e2e8f0;
  }

  .active .timer-unit {
    background: linear-gradient(135deg, rgba(99,102,241,0.05) 0%, rgba(236,72,153,0.05) 100%);
    border-color: rgba(168, 85, 247, 0.2);
  }

  .time-num {
    font-size: 1.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 4px;
  }

  .active .time-num {
    background: var(--gradient-active);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .time-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    font-weight: 600;
  }

  /* Status badges */
  .badge {
    position: absolute;
    top: -10px;
    right: 20px;
    background: var(--gradient-active);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  #loading {
    font-weight: 600;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  /* Simple loading spinner */
  .spinner {
    width: 20px;
    height: 20px;
    border: 3px solid rgba(99,102,241,0.3);
    border-radius: 50%;
    border-top-color: #6366f1;
    animation: spin 1s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="timeline-wrapper">
  <div id="loading">
    <div class="spinner"></div> Synchronizing Time...
  </div>
  <div class="timeline-container" id="timeline-container" style="display: none;">
    <!-- Cards will be injected here automatically -->
  </div>
</div>

<script>
  // Event Data Array
  const events = [
    { name: "OPPE 1", dateStr: "2026-08-02T09:00:00+05:30", type: "exam" },
    { name: "MAD-II Project", dateStr: "2026-08-09T23:59:00+05:30", type: "project" },
    { name: "Quiz 2", dateStr: "2026-08-16T09:00:00+05:30", type: "quiz" },
    { name: "OPPE 2", dateStr: "2026-08-30T09:00:00+05:30", type: "exam" },
    { name: "End Sem", dateStr: "2026-09-13T09:00:00+05:30", type: "exam" }
  ];

  let timeOffset = 0; 
  let initialized = false;

  // SVG Icons library built directly into the script for offline/Notion capability
  const icons = {
    exam: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
    project: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/><path d="M12 4l-4 16"/></svg>`,
    quiz: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>`
  };

  async function syncNetworkTime() {
    try {
      const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Kolkata');
      const data = await response.json();
      const networkTime = new Date(data.datetime).getTime();
      const localTime = new Date().getTime();
      timeOffset = networkTime - localTime;
    } catch (error) {
      console.error("Sync failed, using local time");
    } finally {
      initialized = true;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('timeline-container').style.display = 'flex';
    }
  }

  function formatDate(dateObj) {
    const options = { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' };
    return dateObj.toLocaleDateString('en-IN', options);
  }

  function renderCards() {
    if (!initialized) return;

    const now = new Date().getTime() + timeOffset;

    // Filter past events and sort by distance
    const futureEvents = events
      .map(event => {
        const targetTime = new Date(event.dateStr).getTime();
        return { ...event, targetTime, distance: targetTime - now };
      })
      .filter(event => event.distance > 0)
      .sort((a, b) => a.distance - b.distance);

    if (futureEvents.length === 0) {
      document.getElementById('timeline-container').innerHTML = "<div style='padding: 20px;'>All milestones completed! 🎉</div>";
      return;
    }

    // Generate HTML for each card horizontally
    const htmlCards = futureEvents.map((event, index) => {
      const isClosest = index === 0;
      
      const d = Math.floor(event.distance / (1000 * 60 * 60 * 24));
      const h = Math.floor((event.distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((event.distance % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((event.distance % (1000 * 60)) / 1000);

      const icon = icons[event.type] || icons.exam;
      const dateDisplay = formatDate(new Date(event.targetTime));
      
      // Determine CSS classes and badge for the primary card
      const cardClass = isClosest ? "event-card active" : "event-card";
      const badgeHtml = isClosest ? `<div class="badge">Up Next</div>` : "";

      return `
        <div class="${cardClass}">
          ${badgeHtml}
          <div class="card-header">
            <div class="icon-box">${icon}</div>
            <div class="card-title-group">
              <h3 class="card-title">${event.name}</h3>
              <span class="card-date">${dateDisplay}</span>
            </div>
          </div>
          <div class="timer-grid">
            <div class="timer-unit">
              <div class="time-num">${String(d).padStart(2, '0')}</div>
              <div class="time-label">Days</div>
            </div>
            <div class="timer-unit">
              <div class="time-num">${String(h).padStart(2, '0')}</div>
              <div class="time-label">Hrs</div>
            </div>
            <div class="timer-unit">
              <div class="time-num">${String(m).padStart(2, '0')}</div>
              <div class="time-label">Mins</div>
            </div>
            <div class="timer-unit">
              <div class="time-num">${String(s).padStart(2, '0')}</div>
              <div class="time-label">Secs</div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('timeline-container').innerHTML = htmlCards;
  }

  // Initialize and loop
  syncNetworkTime().then(() => {
    renderCards();
    setInterval(renderCards, 1000);
  });
</script>

</body>
</html>
